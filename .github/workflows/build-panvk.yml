name: Build PanVK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'PanVK branch or tag'
        required: true
        default: 'panvk-27.0.0-devel-20261025'
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  fedora-44:
    runs-on: ubuntu-26.04-arm
    container:
      image: fedora:44
      options: --privileged --user root

    steps:
      - name: Install dependencies
        run: |
          echo "assumeyes=True" >> /etc/dnf/dnf.conf
          dnf install -y dnf-plugins-core git ccache libarchive-devel rust cargo
          dnf config-manager setopt fedora-source.enabled=1 updates-source.enabled=1
          dnf makecache
          dnf builddep -y mesa

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /root/.ccache
          key: ccache-panvk-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-panvk-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Set release name suffix
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          cd "$GITHUB_WORKSPACE"
          version=$(grep -v '^[[:space:]]*$' VERSION | head -n1)
          build_date=$(TZ=Asia/Shanghai date +%Y%m%d)
          source_ref="${SOURCE_REF#refs/tags/}"
          if [[ "$source_ref" =~ ^panvk-.*-devel-([0-9]{8}(-r[0-9]+)?)$ ]]; then
            build_date="${BASH_REMATCH[1]}"
          fi
          echo "MESA_RELEASE_NAME_SUFFIX=${version}-${build_date}_fedora_44_arm64" >> "$GITHUB_ENV"

      - name: Build PanVK
        shell: bash
        run: |
          export CCACHE_DIR=/root/.ccache
          echo "Building PanVK..."
          cd "$GITHUB_WORKSPACE"
          meson setup build/ \
              --prefix=/usr \
              -Dplatforms=x11,wayland \
              -Dgallium-drivers= \
              -Dgallium-va=disabled \
              -Dgallium-mediafoundation=disabled \
              -Dvulkan-drivers=panfrost \
              -Dvulkan-layers= \
              -Dgles1=disabled \
              -Dgles2=disabled \
              -Dopengl=false \
              -Dgbm=disabled \
              -Dglx=disabled \
              -Dxlib-lease=disabled \
              -Dpanfrost-kmds=kbase \
              -Dpanfrost-rust=true \
              -Degl=disabled \
              -Dglvnd=disabled \
              -Dintel-rt=disabled \
              -Dmicrosoft-clc=disabled \
              -Dllvm=enabled \
              -Dvalgrind=disabled \
              -Dbuild-tests=false \
              -Dlibunwind=disabled \
              -Dlmsensors=disabled \
              -Dandroid-libbacktrace=disabled \
              -Dbuildtype=release
          ninja -C build/
          echo "PanVK build completed successfully!"

      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: /root/.ccache
          key: ccache-panvk-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package PanVK
        shell: bash
        run: |
          echo "Packaging PanVK..."
          cd "$GITHUB_WORKSPACE"
          mkdir /tmp/mesa-install-tmp
          DESTDIR=/tmp/mesa-install-tmp meson install --no-rebuild -C build/
          tar -zcvf "panvk_${MESA_RELEASE_NAME_SUFFIX}.tar.gz" -C /tmp/mesa-install-tmp .
          rm -rf /tmp/mesa-install-tmp
          echo "Calculating sha256 checksums..."
          sha256sum "panvk_${MESA_RELEASE_NAME_SUFFIX}.tar.gz" > sha256sums.txt
          cat sha256sums.txt && echo
          echo "Packaging completed successfully!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: panvk_${{ env.MESA_RELEASE_NAME_SUFFIX }}
          path: |
            *.tar.gz
            sha256sums.txt
          retention-days: 90
  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    permissions:
      contents: write
    needs:
      - fedora-44
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        id: release
        shell: bash
        env:
          SOURCE_REF: ${{ github.event.inputs.tag }}
        run: |
          echo "tag=${SOURCE_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; -exec echo \; | awk 'NF>=2 {print $1 "  " $2}' | sort -k2,2)
          cat <<'EOF' > release_body.md
          ## Checksums
          ```plaintext
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Upload archives to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.tar.gz
            ./artifacts/**/*.tar
